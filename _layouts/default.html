<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.nav != 'home' %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container site-header-inner">
      <a class="wordmark" href="{{ '/' | relative_url }}">
        <span class="monogram" aria-hidden="true">JS</span>
        {{ site.title | escape }}
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}"{% if page.nav == 'home' %} aria-current="page"{% endif %}>Home</a>
        <a href="{{ '/research.html' | relative_url }}"{% if page.nav == 'research' %} aria-current="page"{% endif %}>Research</a>
        <a href="{{ '/publication.html' | relative_url }}"{% if page.nav == 'publications' %} aria-current="page"{% endif %}>Publications</a>
        <a href="{{ '/News.html' | relative_url }}"{% if page.nav == 'news' %} aria-current="page"{% endif %}>News</a>
        <a href="{{ '/positions.html' | relative_url }}"{% if page.nav == 'positions' %} aria-current="page"{% endif %}>Positions</a>
      </nav>
      <a class="button button-outline header-cv" href="{{ site.cv | relative_url }}">CV</a>
    </div>
  </header>
  <main id="main" tabindex="-1">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="container site-footer-inner">
      <span>© {{ site.time | date: '%Y' }} {{ site.title | escape }}</span>
      <a href="mailto:{{ site.email }}">{{ site.email }}</a>
    </div>
  </footer>
</body>
</html>
