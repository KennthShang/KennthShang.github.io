- date: "2026-11-10"
  id: seekrbp
  title: "SeekRBP published in Bioinformatics"
  summary: >-
    SeekRBP combines protein sequence and structural information to identify
    receptor-binding proteins in bacteriophages. These proteins help determine
    which bacteria a phage can recognize.
  links:
    - label: SeekRBP paper
      url: https://doi.org/10.1093/bioinformatics/btag813

- date: "2026-08-01"
  id: eccb-2026
  title: "ViralQC and TPMM appear in the ECCB 2026 proceedings"
  summary: >-
    ViralQC checks assembled viral sequences for completeness and contamination.
    TPMM detects DNA inversions in metagenomes, including samples where
    sequencing coverage is sparse.
  links:
    - label: ViralQC paper
      url: https://doi.org/10.1093/bioinformatics/btag463
    - label: TPMM paper
      url: https://doi.org/10.1093/bioinformatics/btag437

- date: "2026-07-01"
  id: phagemind
  title: "PhageMind published in the ISMB 2026 proceedings"
  summary: >-
    PhageMind predicts phage hosts at the level of individual bacterial strains.
    We designed it to work across bacterial groups even when few known
    phage–host pairs are available for training.
  links:
    - label: PhageMind paper
      url: https://doi.org/10.1093/bioinformatics/btag262

- date: "2026-04-23"
  id: phabox2
  title: "PhaBOX2 published in Nucleic Acids Research"
  summary: >-
    PhaBOX2 extends our original web server beyond bacteriophages. It brings
    viral sequence discovery, taxonomic classification, and protein annotation
    together in one interface for metagenomic data.
  links:
    - label: PhaBOX2 paper
      url: https://doi.org/10.1093/nar/gkag382

- date: "2026-02-07"
  id: plasrag
  title: "PlasRAG published in Genome Biology"
  summary: >-
    PlasRAG connects plasmid DNA sequences with written descriptions. Researchers
    can use it to characterize a plasmid sequence or find plasmids by describing
    the properties they want to study.
  links:
    - label: PlasRAG paper
      url: https://doi.org/10.1186/s13059-026-03966-7

- date: "2025-11-24"
  id: phage-host-benchmark
  title: "Phage–host prediction benchmark published in Briefings in Bioinformatics"
  summary: >-
    We evaluated 27 phage–host prediction tools on two benchmarks representing
    different research settings. The study compares how the tools trade off
    accuracy, prediction coverage, and computational cost.
  links:
    - label: Benchmark paper
      url: https://doi.org/10.1093/bib/bbaf626

- date: "2025-07-20"
  id: gianthunter
  title: "GiantHunter in the ISMB/ECCB 2025 proceedings"
  summary: >-
    GiantHunter identifies giant-virus sequences in metagenomes. The study
    benchmarks how reliably it finds these sequences among the many other
    organisms represented in a sample.
  links:
    - label: GiantHunter paper
      url: https://doi.org/10.1093/bioinformatics/btaf239

- date: "2024-09-24"
  id: mtdp
  title: "Multi-teacher protein embedding paper published in Bioinformatics"
  summary: >-
    We trained a compact model to learn protein representations from multiple
    pretrained models. It reduces the cost of generating embeddings for
    large-scale protein analysis while retaining accuracy across the tasks we tested.
  links:
    - label: Protein embedding paper
      url: https://doi.org/10.1093/bioinformatics/btae567

- date: "2023-06-24"
  id: plasme
  title: "PLASMe accepted by Nucleic Acids Research"
  summary: >-
    PLASMe identifies plasmid sequences in short-read assemblies. It combines
    sequence comparisons with a learning-based model to recognize both
    familiar plasmids and ones that differ from available references.
  links:
    - label: PLASMe paper
      url: https://academic.oup.com/nar/advance-article/doi/10.1093/nar/gkad578/7222081
    - label: PLASMe code
      url: https://github.com/HubertTang/PLASMe

- date: "2023-04-19"
  id: hotspot
  title: "HOTSPOT accepted by Bioinformatics"
  summary: >-
    HOTSPOT predicts likely bacterial hosts for assembled plasmid sequences.
    It reports predictions at several taxonomic levels, from broad host groups
    down to individual species.
  links:
    - label: HOTSPOT paper
      url: https://academic.oup.com/bioinformatics/article/39/5/btad283/7136643

- date: "2023-01-03"
  id: phabox
  title: "PhaBOX web server released"
  summary: >-
    We released PhaBOX to make several common phage analyses available in one
    web interface. It helps researchers identify phage sequences in metagenomes
    and explore their taxonomy, likely hosts, and lifestyles.
  links:
    - label: PhaBOX web server
      url: https://phage.ee.cityu.edu.hk/

- date: "2022-12-22"
  id: phage-taxonomy-review
  title: "Review of phage taxonomy classification accepted"
  summary: >-
    This review explains how changes to the ICTV classification framework
    affect the way phages are classified. It compares existing tools and
    discusses which ones suit different datasets and research questions.
  links:
    - label: Phage taxonomy review
      url: https://www.frontiersin.org/articles/10.3389/fmicb.2022.1032186

- date: "2022-10-21"
  id: haplodmf
  title: "HaploDMF published in Bioinformatics"
  summary: >-
    HaploDMF reconstructs viral haplotypes from long sequencing reads.
    It is designed to distinguish closely related viral variants that coexist
    in the same sample.
  links:
    - label: HaploDMF paper
      url: https://doi.org/10.1093/bioinformatics/btac708
    - label: HaploDMF code
      url: https://github.com/dhcai21/HaploDMF

- date: "2022-10-17"
  id: phatyp
  title: "PhaTYP published in Briefings in Bioinformatics"
  summary: >-
    PhaTYP predicts whether a bacteriophage is virulent or temperate from
    genomic fragments. The study evaluates how well it works when only
    short fragments are available.
  links:
    - label: PhaTYP paper
      url: https://doi.org/10.1093/bib/bbac487
    - label: PhaTYP code
      url: https://github.com/KennthShang/PhaTYP

- date: "2022-06-30"
  id: phamer
  title: "PhaMer published in Briefings in Bioinformatics"
  summary: >-
    PhaMer uses a Transformer to recognize bacteriophage sequences in
    metagenomic assemblies. We tested it on simulated and real datasets,
    including short fragments that are harder to classify.
  links:
    - label: PhaMer paper
      url: https://doi.org/10.1093/bib/bbac258
    - label: PhaMer code
      url: https://github.com/KennthShang/PhaMer

- date: "2022-05-22"
  id: cherry
  title: "CHERRY published in Briefings in Bioinformatics"
  summary: >-
    CHERRY predicts which bacteria or archaea a virus is likely to infect.
    It represents viruses and potential hosts as a network and uses their
    relationships to infer new host associations.
  links:
    - label: CHERRY paper
      url: https://doi.org/10.1093/bib/bbac182
    - label: CHERRY code
      url: https://github.com/KennthShang/CHERRY

- date: "2022-02-07"
  id: rdrpbin
  title: "RdRpBin published in Briefings in Bioinformatics"
  summary: >-
    RdRpBin classifies RNA virus reads from metagenomic samples using signals
    from a conserved viral gene. The study tests how well it assigns reads
    whose sequences differ from those of known viruses.
  links:
    - label: RdRpBin paper
      url: https://doi.org/10.1093/bib/bbac011
    - label: RdRpBin code
      url: https://github.com/HubertTang/RdRpBin
